name: Build and deploy website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Cancel superseded runs so only the latest commit deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site from content/site.yaml
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing — build failed" && exit 1)
          test -f dist/404.html || (echo "::error::dist/404.html missing" && exit 1)
          test -f dist/admin/index.html || (echo "::error::dist/admin/index.html missing" && exit 1)
          echo "Build output verified:"
          ls -la dist

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
