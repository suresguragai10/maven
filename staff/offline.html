<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>You're offline — Maven Work Desk</title>
<style>
  :root{
    --navy-950:#0A1F3A;--navy-900:#102A4C;
    --gold-500:#C79A3E;--gold-600:#A87D2E;
    --mist:#F4F6F8;--border:#DEE3E9;--ink:#1C2530;--ink-soft:#4B5A6B;
    --font:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:var(--font);color:var(--ink);background:var(--mist);padding:24px;
  }
  .card{
    max-width:400px;width:100%;background:#fff;border:1px solid var(--border);border-radius:16px;
    padding:36px 30px;text-align:center;box-shadow:0 10px 30px -12px rgba(16,42,76,.18);
  }
  .mark{
    width:56px;height:56px;border-radius:50%;background:var(--navy-950);color:var(--gold-500);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.5rem;
  }
  h1{margin:0 0 10px;font-size:1.3rem;color:var(--navy-950);}
  p{margin:0 0 24px;color:var(--ink-soft);font-size:.95rem;line-height:1.55;}
  button{
    font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;font-weight:700;padding:12px 22px;border-radius:999px;border:2px solid transparent;
    background:var(--gold-500);color:var(--navy-950);width:100%;
  }
  button:hover{background:var(--gold-600);}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">&#9729;</div>
    <h1>You're offline</h1>
    <p>Work Desk needs an internet connection to load your data securely — nothing is stored on this device. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
