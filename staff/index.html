<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maven Consultancy — Staff Portal</title>
<link rel="icon" type="image/png" href="/images/logo-icon.png">
<style>
  :root{
    --navy-950:#0A1F3A;--navy-900:#102A4C;--navy-800:#163A63;--navy-700:#1D4A7A;
    --gold-500:#C79A3E;--gold-600:#A87D2E;--gold-700:#8F6B22;--gold-100:#F7EFDC;
    --mist:#F4F6F8;--mist-dark:#ECEFF3;--border:#DEE3E9;--ink:#1C2530;--ink-soft:#4B5A6B;
    --red:#B3261E;--red-soft:#FBEAE9;--green:#1E7B3E;--green-soft:#E9F6ED;--amber:#9A6B00;--amber-soft:#FBF1DC;
    --font:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--mist);}
  h1,h2,h3{font-family:var(--font);color:var(--navy-950);margin:0;}
  a{color:var(--gold-700);}
  button{font:inherit;cursor:pointer;}
  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);}
  input:disabled,textarea:disabled,select:disabled{background:var(--mist-dark);color:var(--ink-soft);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-500);}
  textarea{resize:vertical;}
  .hidden{display:none !important;}

  /* ---- Login screen ---- */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px;max-width:400px;width:100%;box-shadow:0 20px 40px -20px rgba(16,42,76,.3);}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-card .brand img{width:36px;height:36px;}
  .login-card .brand span{font-weight:700;color:var(--navy-950);font-size:1.05rem;}
  .login-card h1{font-size:1.2rem;margin-bottom:4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 22px;}
  .f{margin-bottom:14px;}
  .f label{display:block;font-size:.82rem;font-weight:700;color:var(--navy-900);margin-bottom:5px;}
  .f-hint{display:block;font-size:.76rem;color:var(--ink-soft);margin-top:4px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:12px 20px;border-radius:999px;border:2px solid transparent;background:var(--gold-500);color:var(--navy-950);}
  .btn:hover{background:var(--gold-600);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-outline{background:transparent;border-color:var(--navy-800);color:var(--navy-900);}
  .btn-outline:hover{background:var(--mist-dark);}
  .btn-sm{padding:8px 14px;font-size:.85rem;}
  .btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red-soft);}
  .msg{padding:10px 14px;border-radius:8px;font-size:.88rem;margin-bottom:14px;}
  .msg-error{background:var(--red-soft);color:var(--red);border:1px solid #F1BEBA;}
  .msg-ok{background:var(--green-soft);color:var(--green);border:1px solid #BCE3C7;}

  /* ---- Icons (inline SVG, stroke-based — see the icon() helper in staff.js) ---- */
  .ic{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic-lg{width:22px;height:22px;}

  /* ---- Avatars ---- */
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--navy-100,#E4EAF2);color:var(--navy-800);font-size:.72rem;font-weight:700;flex-shrink:0;letter-spacing:.02em;}
  .avatar-sm{width:24px;height:24px;font-size:.64rem;}
  .avatar-gold{background:var(--gold-100);color:var(--gold-700);}

  /* ---- App shell ---- */
  #topbar{position:sticky;top:0;z-index:20;background:var(--navy-950);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap;}
  #topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;flex-shrink:0;}
  #topbar .brand img{width:28px;height:28px;}
  #topbar .spacer{flex:1;}
  #topbar .who{font-size:.84rem;color:rgba(255,255,255,.75);text-align:right;line-height:1.3;}
  #topbar .who strong{color:#fff;display:block;}
  #layout{display:flex;max-width:1300px;margin:0 auto;}
  #sidebar{width:220px;flex-shrink:0;padding:22px 10px;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);overflow-y:auto;}
  #sidebar button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink-soft);font-size:.9rem;font-weight:600;background:none;border:none;margin-bottom:2px;transition:background .12s ease,color .12s ease;}
  #sidebar button .ic{color:var(--ink-soft);opacity:.8;}
  #sidebar button:hover{background:#fff;color:var(--navy-900);}
  #sidebar button.is-active{background:var(--navy-950);color:#fff;}
  #sidebar button.is-active .ic{color:var(--gold-500);opacity:1;}
  #sidebar .sidebar-group{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:14px 12px 6px;}
  #main{flex:1;padding:26px 26px 90px;min-width:0;}
  @media (max-width:820px){ #layout{flex-direction:column;} #sidebar{position:static;height:auto;width:100%;display:flex;flex-wrap:wrap;gap:2px;padding:14px;} #sidebar .sidebar-group{display:none;} }

  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,42,76,.04);}
  .card h2{font-size:1.1rem;margin-bottom:4px;display:flex;align-items:center;gap:9px;}
  .card h2 .ic{color:var(--gold-600);}
  .card p.desc{color:var(--ink-soft);font-size:.87rem;margin:0 0 16px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:1.4rem;}

  /* ---- Task list / board ---- */
  .task-group{margin-bottom:24px;}
  .task-group h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .task-group h3 .count{background:var(--mist-dark);color:var(--navy-800);border-radius:999px;padding:1px 9px;font-size:.75rem;}
  .task-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;}
  .task-row:hover{border-color:var(--gold-500);box-shadow:0 4px 14px -6px rgba(16,42,76,.18);transform:translateY(-1px);}
  .task-row .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .priority-dot-low{background:var(--border);}
  .priority-dot-normal{background:#1D4ED8;}
  .priority-dot-high{background:var(--red);}
  .task-row .title{flex:1;min-width:0;}
  .task-row .title strong{display:block;font-size:.95rem;color:var(--navy-950);}
  .task-row .title span{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin-top:2px;}
  .task-row .title span .ic{width:13px;height:13px;}
  .task-row .due{font-size:.8rem;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .task-row .due .ic{width:14px;height:14px;}
  .task-row .due.overdue{color:var(--red);font-weight:700;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;}
  .badge-not_started{background:var(--mist-dark);color:var(--ink-soft);}
  .badge-in_progress{background:#E4EEFB;color:#1D4ED8;}
  .badge-waiting_for_client{background:var(--amber-soft);color:var(--amber);}
  .badge-ready_for_review{background:#EDE4FB;color:#6D28D9;}
  .badge-changes_required{background:var(--red-soft);color:var(--red);}
  .badge-completed{background:var(--green-soft);color:var(--green);}
  .badge-type{background:var(--gold-100);color:var(--gold-700);}
  .empty-note{color:var(--ink-soft);font-size:.9rem;padding:24px 16px;text-align:center;}
  .empty-note .ic{display:block;margin:0 auto 10px;color:var(--border);width:32px;height:32px;}

  /* ---- Task detail ---- */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:18px 0;}
  .meta-item{display:flex;align-items:flex-start;gap:10px;}
  .meta-item .ic{color:var(--gold-600);margin-top:2px;}
  .meta-item label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px;}
  .meta-item .value{display:flex;align-items:center;gap:7px;font-size:.94rem;color:var(--navy-950);}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .checklist-item input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--gold-600);}
  .checklist-item span{flex:1;font-size:.92rem;}
  .checklist-item.done span{text-decoration:line-through;color:var(--ink-soft);}
  .comment{padding:12px 0;border-bottom:1px solid var(--border);}
  .comment .who{font-size:.8rem;font-weight:700;color:var(--navy-900);}
  .comment .when{font-size:.74rem;color:var(--ink-soft);margin-left:8px;font-weight:400;}
  .comment p{margin:5px 0 0;font-size:.92rem;white-space:pre-wrap;}

  /* ---- Tables (engagements/staff) ---- */
  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .role-select{width:auto;padding:6px 10px;font-size:.85rem;}
  .inactive-row{opacity:.5;}

  /* ---- Client cards ---- */
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .client-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;}
  .client-card.inactive-row{opacity:.55;}
  .client-card .client-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .client-card h3{font-size:1.02rem;color:var(--navy-950);margin-bottom:2px;}
  .client-card .pan-vat{font-size:.78rem;color:var(--ink-soft);font-family:ui-monospace,Consolas,monospace;}
  .client-card .contact-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);margin-top:9px;}
  .client-card .contact-row .ic{width:14px;height:14px;color:var(--ink-soft);}
  .client-card .actions{margin-top:14px;display:flex;gap:8px;}

  #toast{position:fixed;bottom:24px;right:24px;max-width:360px;background:var(--navy-950);color:#fff;padding:16px 20px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:50;font-size:.9rem;}
  #toast.error{background:var(--red);}

  /* ---- Modal (used for new task/client/engagement forms) ---- */
  #modalOverlay{position:fixed;inset:0;background:rgba(10,31,58,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
  #modalCard{background:#fff;border-radius:14px;padding:28px;max-width:520px;width:100%;box-shadow:0 24px 48px rgba(0,0,0,.3);}
  #modalCard .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  #modalCard .modal-actions{display:flex;gap:10px;margin-top:20px;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand"><img src="/images/logo-icon.png" alt=""><span>Maven Consultancy</span></div>
    <h1>Staff Portal</h1>
    <p class="sub">Sign in with the email and password you were given.</p>
    <div id="loginMsg"></div>
    <div class="f">
      <label for="in-email">Email</label>
      <input id="in-email" type="email" autocomplete="username">
    </div>
    <div class="f">
      <label for="in-password">Password</label>
      <input id="in-password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-block" id="loginBtn">Sign In</button>
    <p class="f-hint" style="margin-top:14px;text-align:center">Don't have an account? Ask your admin to invite you.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <div class="brand"><img src="/images/logo-icon.png" alt=""><span>Maven Staff Portal</span></div>
    <div class="spacer"></div>
    <div class="who"><strong id="whoName">—</strong><span id="whoRole">—</span></div>
    <button class="btn btn-outline btn-sm" id="logoutBtn">Sign Out</button>
  </header>
  <div id="layout">
    <nav id="sidebar"></nav>
    <main id="main"></main>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="modalOverlay" class="hidden"><div id="modalCard"></div></div>

<script src="supabase.js"></script>
<script src="staff.js"></script>
</body>
</html>
