<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Maven Work Desk</title>
<link rel="icon" type="image/png" href="/images/logo-icon.png">
<link rel="manifest" href="/staff/manifest.webmanifest">
<link rel="apple-touch-icon" href="/images/logo-icon.png">
<meta name="theme-color" content="#0A1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Desk">
<style>
  :root{
    --navy-950:#0A1F3A;--navy-900:#102A4C;--navy-800:#163A63;--navy-700:#1D4A7A;
    --gold-500:#C79A3E;--gold-600:#A87D2E;--gold-700:#8F6B22;--gold-100:#F7EFDC;
    --mist:#F4F6F8;--mist-dark:#ECEFF3;--border:#DEE3E9;--ink:#1C2530;--ink-soft:#4B5A6B;
    --red:#B3261E;--red-soft:#FBEAE9;--green:#1E7B3E;--green-soft:#E9F6ED;--amber:#9A6B00;--amber-soft:#FBF1DC;
    --teal:#0F766E;--teal-soft:#E6F5F3;
    --font:'Segoe UI',-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--mist);}
  h1,h2,h3{font-family:var(--font);color:var(--navy-950);margin:0;}
  a{color:var(--gold-700);}
  button{font:inherit;cursor:pointer;}
  input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);}
  input:disabled,textarea:disabled,select:disabled{background:var(--mist-dark);color:var(--ink-soft);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--gold-500);outline-offset:1px;border-color:var(--gold-500);}
  /* Handbook Task 26: every other interactive element (buttons, links,
     task rows) relied on the browser's own default focus ring here — this
     was the one place it was explicitly suppressed and replaced with only
     a border-color change, which isn't reliably visible enough on its own
     (e.g. thin borders, or a <select>'s browser-drawn chrome). */
  textarea{resize:vertical;}
  .hidden{display:none !important;}

  /* Handbook Task 26 */
  .skip-link{position:absolute;left:-999px;top:0;background:var(--navy-900);color:#fff;padding:10px 16px;z-index:200;border-radius:0 0 8px 0;}
  .skip-link:focus{left:0;}

  /* ---- Login screen ---- */
  #loginScreen,#otpScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:36px;max-width:400px;width:100%;box-shadow:0 20px 40px -20px rgba(16,42,76,.3);}
  .login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .login-card .brand img{width:36px;height:36px;}
  .login-card .brand span{font-weight:700;color:var(--navy-950);font-size:1.05rem;}
  .login-card h1{font-size:1.2rem;margin-bottom:4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 22px;}
  .f{margin-bottom:14px;}
  .f label{display:block;font-size:.82rem;font-weight:700;color:var(--navy-900);margin-bottom:5px;}
  .f-hint{display:block;font-size:.76rem;color:var(--ink-soft);margin-top:4px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:12px 20px;border-radius:999px;border:2px solid transparent;background:var(--gold-500);color:var(--navy-950);}
  .btn:hover{background:var(--gold-600);}
  .btn:disabled{opacity:.55;cursor:not-allowed;}
  .btn-block{width:100%;}
  .btn-outline{background:transparent;border-color:var(--navy-800);color:var(--navy-900);}
  .btn-outline:hover{background:var(--mist-dark);}
  .btn-sm{padding:8px 14px;font-size:.85rem;}
  .btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
  .btn-danger:hover{background:var(--red-soft);}
  .msg{padding:10px 14px;border-radius:8px;font-size:.88rem;margin-bottom:14px;}
  .msg-error{background:var(--red-soft);color:var(--red);border:1px solid #F1BEBA;}
  .msg-ok{background:var(--green-soft);color:var(--green);border:1px solid #BCE3C7;}

  /* ---- Icons (inline SVG, stroke-based — see the icon() helper in staff.js) ---- */
  .ic{width:17px;height:17px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic-lg{width:22px;height:22px;}

  /* ---- Avatars ---- */
  .avatar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--navy-100,#E4EAF2);color:var(--navy-800);font-size:.72rem;font-weight:700;flex-shrink:0;letter-spacing:.02em;}
  .avatar-sm{width:24px;height:24px;font-size:.64rem;}
  .avatar-gold{background:var(--gold-100);color:var(--gold-700);}
  img.avatar{object-fit:cover;}

  /* ---- App shell ---- */
  #topbar{position:sticky;top:0;z-index:20;background:var(--navy-950);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap;}
  #topbar .brand{display:flex;align-items:center;gap:9px;font-weight:700;flex-shrink:0;background:none;border:none;padding:4px;margin:-4px;border-radius:8px;color:#fff;cursor:pointer;transition:background .12s ease;}
  #topbar .brand:hover{background:rgba(255,255,255,.1);}
  #topbar .brand img{width:28px;height:28px;}
  /* .btn-outline's default colors (dark navy text/border on transparent)
     are meant for the light card backgrounds it's used on everywhere else
     in the app -- inside the topbar itself (also dark navy), that made
     the Global Search, Notifications and Sign Out buttons nearly
     invisible: dark text/icon on a dark background. */
  #topbar .btn-outline{border-color:rgba(255,255,255,.35);color:#fff;}
  #topbar .btn-outline:hover{background:rgba(255,255,255,.12);}
  #topbar .spacer{flex:1;}
  #topbar .who{font-size:.84rem;color:rgba(255,255,255,.75);text-align:right;line-height:1.3;}
  #topbar .who strong{color:#fff;display:block;}
  #notifBellBtn{position:relative;}
  .notif-badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
  .notif-panel{position:fixed;top:57px;right:20px;width:340px;max-width:calc(100vw - 40px);max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.22);z-index:35;}
  .notif-panel .notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);}
  .notif-panel .notif-head strong{font-size:.88rem;color:var(--navy-950);}
  /* Task 29: explicit scope note under the panel header -- see that
     call site's own comment on why this line exists. */
  .notif-scope-note{padding:8px 14px;font-size:.72rem;color:var(--ink-soft);border-bottom:1px solid var(--border);background:var(--mist);}
  .notif-row{display:flex;align-items:flex-start;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notif-row:hover{background:var(--mist);}
  .notif-row.is-read{opacity:.55;}
  .notif-row .notif-body{flex:1;min-width:0;}
  .notif-row .notif-title{font-size:.85rem;color:var(--navy-950);}
  .notif-row .notif-when{font-size:.72rem;color:var(--ink-soft);margin-top:2px;}
  .notif-row .notif-dismiss{background:none;border:none;color:var(--ink-soft);font-size:1rem;line-height:1;padding:2px 4px;cursor:pointer;flex:0 0 auto;}
  .notif-row .notif-dismiss:hover{color:var(--red);}
  .notif-empty{padding:20px 14px;text-align:center;font-size:.85rem;color:var(--ink-soft);}
  #layout{display:flex;max-width:1300px;margin:0 auto;}
  #sidebar{width:220px;flex-shrink:0;padding:22px 10px;position:sticky;top:57px;align-self:flex-start;height:calc(100vh - 57px);overflow-y:auto;}
  #sidebar button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:var(--ink-soft);font-size:.9rem;font-weight:600;background:none;border:none;margin-bottom:2px;transition:background .12s ease,color .12s ease;}
  #sidebar button .ic{color:var(--ink-soft);opacity:.8;}
  #sidebar button:hover{background:#fff;color:var(--navy-900);}
  #sidebar button.is-active{background:var(--navy-950);color:#fff;}
  #sidebar button.is-active .ic{color:var(--gold-500);opacity:1;}
  #sidebar .sidebar-group{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:14px 12px 6px;}
  #main{flex:1;padding:26px 26px 90px;min-width:0;}

  /* ---- Page-level sub-navigation (Task 22): a small horizontal tab row
     used by grouped destinations (Client Work, Firm Work, Team, Reports,
     Personal, Admin) so those areas can hold several related screens
     behind one primary sidebar entry instead of each screen being its own
     top-level destination. Only rendered when a group has 2+ screens
     visible to the current role — see renderGroupTabs() in staff.js. */
  .subtabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);flex-wrap:wrap;}
  .subtab{padding:10px 16px;font-size:.87rem;font-weight:600;color:var(--ink-soft);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .subtab:hover{color:var(--navy-900);}
  .subtab.is-active{color:var(--navy-950);border-bottom-color:var(--gold-500);}

  /* ---- Mobile nav drawer (Task 22): replaces the old wrapped-button
     sidebar row on small screens with an off-canvas panel, same
     open/close/focus-trap convention as the public site's .mobile-nav
     (client.js) — hamburger toggle in the topbar, full-viewport panel,
     Escape/close-button/nav-item-click all close it, focus returns to the
     toggle on close. Desktop (>820px) never sees any of this; the toggle
     and close button are hidden there and #sidebar stays the plain sticky
     column it always was. */
  .drawer-toggle,.drawer-close{display:none;}
  @media (max-width:820px){
    #layout{flex-direction:column;}
    .drawer-toggle{display:inline-flex;}
    .drawer-close{display:none;position:fixed;top:12px;right:16px;z-index:201;color:#fff;}
    body.nav-drawer-open .drawer-close{display:inline-flex;}
    body.nav-drawer-open{overflow:hidden;}
    #sidebar{position:fixed;inset:0;z-index:200;width:100%;height:100vh;background:var(--navy-950);padding:64px 18px 24px;overflow-y:auto;display:none;}
    body.nav-drawer-open #sidebar{display:block;}
    #sidebar button{color:#fff;padding:13px 12px;font-size:1rem;}
    #sidebar button .ic{color:rgba(255,255,255,.7);}
    #sidebar button:hover{background:rgba(255,255,255,.08);color:#fff;}
    #sidebar button.is-active{background:var(--gold-500);color:var(--navy-950);}
    #sidebar button.is-active .ic{color:var(--navy-950);}
    #sidebar .sidebar-group{color:rgba(255,255,255,.5);}
  }

  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,42,76,.04);}
  .card h2{font-size:1.1rem;margin-bottom:4px;display:flex;align-items:center;gap:9px;}
  .card h2 .ic{color:var(--gold-600);}
  .card p.desc{color:var(--ink-soft);font-size:.87rem;margin:0 0 16px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:1.4rem;}

  /* ---- Task list / board ---- */
  .task-group{margin-bottom:24px;}
  .task-group h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .task-group h3 .count{background:var(--mist-dark);color:var(--navy-800);border-radius:999px;padding:1px 9px;font-size:.75rem;}
  .task-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease;}
  .task-row:hover{border-color:var(--gold-500);box-shadow:0 4px 14px -6px rgba(16,42,76,.18);transform:translateY(-1px);}
  .task-row .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .priority-dot-low{background:var(--border);}
  .priority-dot-normal{background:#1D4ED8;}
  .priority-dot-high{background:var(--red);}
  .presence-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  .presence-dot-online{background:var(--green);}
  .presence-dot-idle{background:var(--amber);}
  .presence-dot-offline{background:var(--border);box-shadow:none;}
  /* Handbook Task 21: min-width (not 0) so a long title/due/badge
     combination wraps the title onto its own line on a narrow viewport
     instead of every sibling cramming onto one line and forcing the
     whole row wider than the page -- found via a real overflow
     measurement on the new Team screen (a long Client title + due date
     + status badge + CLIENT/FIRM tag all in one row is more content
     than any single-person task list page happened to combine before). */
  .task-row .title{flex:1 1 200px;min-width:200px;}
  .task-row .title strong{display:block;font-size:.95rem;color:var(--navy-950);}
  .task-row .title span{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:5px;margin-top:2px;}
  .task-row .title span .ic{width:13px;height:13px;}
  /* Task 28: a neutral "may need a handoff" note (Firm Work rows only) --
     italic to read as a soft observation, not a status/fact the way the
     next-action or blocker lines above it are. */
  .task-row .title .stale-note{font-style:italic;}
  .task-row .due{font-size:.8rem;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:center;gap:5px;}
  .task-row .due .ic{width:14px;height:14px;}
  .task-row .due.overdue{color:var(--red);font-weight:700;}
  /* Task 24: the explicit "what do I do next" label on Client Work rows,
     same visual weight as attentionRow's own .action on Today. */
  .task-row .row-action{font-size:.82rem;font-weight:700;color:var(--gold-700);white-space:nowrap;}
  /* Task 24: a blocked Firm row's own reason -- amber, the same tone
     already used for "Waiting" elsewhere in this app, never the red
     compliance-breach color reserved for Client Work deadlines.
     ".title .blocker" (not just ".blocker") to outrank the more specific
     ".task-row .title span" ink-soft rule above. */
  .task-row .title .blocker{color:var(--amber);font-weight:600;}
  .task-row .title .blocker .ic{color:var(--amber);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;}
  .badge-to_do{background:var(--mist-dark);color:var(--ink-soft);}
  .badge-in_progress{background:#E4EEFB;color:#1D4ED8;}
  .badge-waiting_for_client{background:var(--amber-soft);color:var(--amber);}
  .badge-ready_for_review{background:#EDE4FB;color:#6D28D9;}
  .badge-changes_required{background:var(--red-soft);color:var(--red);}
  .badge-approved{background:var(--teal-soft);color:var(--teal);}
  .badge-completed{background:var(--green-soft);color:var(--green);}
  .badge-ready_to_submit{background:var(--gold-100);color:var(--gold-700);}
  .badge-type{background:var(--gold-100);color:var(--gold-700);}
  .badge-attention-needs_attention{background:var(--amber-soft);color:var(--amber);}
  .badge-attention-high_attention{background:var(--red-soft);color:var(--red);}
  .badge-blocked{background:var(--red-soft);color:var(--red);}
  .badge-review{background:#EDE4FB;color:#6D28D9;}
  /* Handbook Task 20: unmistakable Client/Firm labeling on a combined My
     Work list -- deliberately distinct from every status badge above
     (which already uses these same two color families for OTHER
     meanings), kept small/muted so it reads as a category tag, not
     another status. */
  .badge-scope-client{background:var(--mist-dark);color:var(--navy-800);}
  .badge-scope-firm{background:var(--gold-100);color:var(--gold-700);}
  .empty-note{color:var(--ink-soft);font-size:.9rem;padding:24px 16px;text-align:center;}
  .empty-note .ic{display:block;margin:0 auto 10px;color:var(--border);width:32px;height:32px;}

  /* ---- Today dashboard ---- */
  .greeting{font-size:1.5rem;margin-bottom:2px;}
  .greeting-date{color:var(--ink-soft);font-size:.92rem;margin-bottom:20px;}
  /* Task 23: compact punch in/out status — an action-driving widget (not
     decorative analytics), so it stays a single quiet row rather than the
     full Attendance page's card treatment. */
  .today-attendance-bar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;margin-bottom:20px;font-size:.85rem;flex-wrap:wrap;}
  .today-attendance-bar .ic{color:var(--gold-600);flex-shrink:0;}
  .today-attendance-bar .state-text{flex:1;color:var(--ink-soft);min-width:160px;}
  .today-attendance-bar .state-text strong{color:var(--navy-950);}
  .today-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:26px;}
  .today-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
  .today-stat .n{font-size:1.7rem;font-weight:800;color:var(--navy-950);line-height:1;}
  .today-stat .n.n-red{color:var(--red);}
  .today-stat .n.n-amber{color:var(--amber);}
  .today-stat .n.n-purple{color:#6D28D9;}
  .today-stat .l{font-size:.76rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-top:5px;}
  /* Task 25: the Client Work Hub strip (All Work, Review Queue,
     Deadlines, Clients) — same visual weight as Today's own stat strip,
     but every stat is a real clickable link into another one of those
     four screens (hence <button>, not <div>), which is the whole point
     of this component. */
  .hub-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
  .hub-stat{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .12s ease,box-shadow .12s ease;}
  .hub-stat:hover{border-color:var(--gold-500);box-shadow:0 4px 14px -6px rgba(16,42,76,.18);}
  .hub-stat .n{font-size:1.5rem;font-weight:800;color:var(--navy-950);line-height:1;}
  .hub-stat.n-red .n{color:var(--red);}
  .hub-stat.n-amber .n{color:var(--amber);}
  .hub-stat.n-purple .n{color:#6D28D9;}
  .hub-stat .l{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-top:5px;}
  .section-h{font-size:.95rem;font-weight:700;color:var(--navy-950);margin:0 0 12px;}
  /* Task 23: Firm Work's Today section carries the same gold FIRM badge
     used on My Work/Team rows, so it reads as clearly separate from
     Client Work compliance urgency above without borrowing red/urgent
     color language that belongs to statutory deadlines only. */
  .section-h-firm{display:flex;align-items:center;gap:8px;}
  .section-h-firm .badge{font-size:.65rem;}
  .attention-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--red);border-radius:10px;padding:13px 16px;margin-bottom:8px;cursor:pointer;}
  .attention-row:hover{box-shadow:0 4px 14px -6px rgba(16,42,76,.18);}
  .attention-row.reason-waiting{border-left-color:var(--amber);}
  .attention-row.reason-changes{border-left-color:#6D28D9;}
  .attention-row .body{flex:1;min-width:0;}
  .attention-row .client{font-size:.95rem;font-weight:700;color:var(--navy-950);}
  .attention-row .svc{font-size:.82rem;color:var(--ink-soft);margin-top:1px;}
  .attention-row .reason{font-size:.8rem;font-weight:700;margin-top:5px;}
  .attention-row.reason-waiting .reason{color:var(--amber);}
  .attention-row.reason-changes .reason{color:#6D28D9;}
  .attention-row:not(.reason-waiting):not(.reason-changes) .reason{color:var(--red);}
  .attention-row .action{font-size:.85rem;font-weight:700;color:var(--gold-700);white-space:nowrap;}

  /* ---- Work detail ---- */
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px;}
  /* Task 26: the primary next action, first thing in Overview — same
     gold "action" language as My Work/Today's row-level action labels
     (Task 24), scaled up as its own callout since this is the one
     highest-value line on the whole page. */
  .next-action-callout{display:flex;align-items:center;gap:10px;background:var(--gold-100);border:1px solid #E9D6A8;border-radius:10px;padding:12px 16px;margin:16px 0 4px;font-size:.98rem;font-weight:700;color:var(--gold-700);}
  .next-action-callout .ic{color:var(--gold-600);flex-shrink:0;}
  /* Task 26: compact checklist/waiting/submission state chips -- the
     numeric answer to "how close is this," visible without switching to
     the Checklist tab or scrolling to the full action box below. */
  .detail-chips{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;}
  .detail-chip{display:inline-flex;align-items:center;gap:6px;background:var(--mist);border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;}
  .detail-chip .k{color:var(--ink-soft);font-weight:600;}
  .detail-chip .v{color:var(--navy-950);font-weight:700;}
  .detail-chip.chip-amber{background:var(--amber-soft);border-color:#f0d9a6;}
  .detail-chip.chip-amber .k,.detail-chip.chip-amber .v{color:var(--amber);}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin:18px 0;}
  .meta-item{display:flex;align-items:flex-start;gap:10px;}
  .meta-item .ic{color:var(--gold-600);margin-top:2px;}
  .meta-item label{display:block;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:3px;}
  .meta-item .value{display:flex;align-items:center;gap:7px;font-size:.94rem;color:var(--navy-950);}
  /* Task 26: makes Internal vs External/Statutory deadlines visually
     unmistakable -- not just different label text, a real color-coded
     tag on the value itself. Amber (not red) deliberately: this marks
     WHICH deadline is the legal one, it doesn't mean it's overdue. */
  .meta-item .value .badge{font-size:.6rem;padding:2px 7px;}
  .badge-internal{background:var(--mist-dark);color:var(--ink-soft);}
  .badge-statutory{background:var(--amber-soft);color:var(--amber);}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:18px 0 20px;}
  .tabs button{background:none;border:none;padding:10px 4px;margin-right:22px;font-size:.9rem;font-weight:700;color:var(--ink-soft);border-bottom:2px solid transparent;border-radius:0;}
  .tabs button.is-active{color:var(--navy-950);border-bottom-color:var(--gold-500);}
  .action-box{background:var(--mist);border:1px solid var(--border);border-radius:10px;padding:16px;margin:16px 0;}
  .action-box .action-title{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:8px;}
  .checklist-stage{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:18px 0 4px;}
  .checklist-stage:first-child{margin-top:0;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .checklist-item input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--gold-600);}
  .checklist-item span{flex:1;font-size:.92rem;}
  .checklist-item.done span{text-decoration:line-through;color:var(--ink-soft);}
  .comment{padding:12px 0;border-bottom:1px solid var(--border);}
  .comment .who{font-size:.8rem;font-weight:700;color:var(--navy-900);}
  .comment .when{font-size:.74rem;color:var(--ink-soft);margin-left:8px;font-weight:400;}
  .comment p{margin:5px 0 0;font-size:.92rem;white-space:pre-wrap;}
  /* Task 27: the "Latest Update" preview in Firm Work Detail's top
     summary reuses .comment's who/when styling even though it isn't
     itself a .comment row (it lives inside .action-box). */
  .action-box .who{font-size:.8rem;font-weight:700;color:var(--navy-900);}
  .action-box .when{font-size:.74rem;color:var(--ink-soft);margin-left:8px;font-weight:400;}
  .activity-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
  .activity-row .who{font-weight:700;color:var(--navy-900);}
  .activity-row .when{font-size:.74rem;color:var(--ink-soft);margin-left:8px;font-weight:400;}
  .activity-row .detail{color:var(--ink-soft);margin-top:2px;}

  /* ---- Tables (staff) ---- */
  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--border);}
  td{padding:10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .role-select{width:auto;padding:6px 10px;font-size:.85rem;}
  .inactive-row{opacity:.5;}
  /* Task 32: an explicit Active/Inactive state pill on Staff & Access,
     same visual language as .attendance-status-pill elsewhere. */
  .status-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:700;}
  .status-pill.active{background:var(--green-soft);color:var(--green);}
  .status-pill.inactive{background:var(--mist-dark);color:var(--ink-soft);}

  /* ---- Client cards ---- */
  .client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
  .client-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;}
  .client-card.inactive-row{opacity:.55;}
  .client-card .client-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .client-card h3{font-size:1.02rem;color:var(--navy-950);margin-bottom:2px;}
  .client-card .pan-vat{font-size:.78rem;color:var(--ink-soft);font-family:ui-monospace,Consolas,monospace;}
  .client-card .contact-row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);margin-top:9px;}
  .client-card .contact-row .ic{width:14px;height:14px;color:var(--ink-soft);}
  .client-card .actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
  .client-name-link{background:none;border:none;padding:0;font:inherit;font-size:1.02rem;font-weight:700;color:var(--navy-950);text-align:left;cursor:pointer;}
  .client-name-link:hover{color:var(--gold-700);text-decoration:underline;}

  /* ---- Client detail (Active Work / Active Services / Outstanding) ---- */
  .service-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:8px;background:#fff;}
  .service-row.is-inactive{opacity:.5;}
  .card.is-inactive{opacity:.6;}
  .service-row input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;accent-color:var(--gold-600);}
  .service-row .body{flex:1;min-width:0;}
  .service-row .title{font-weight:700;font-size:.92rem;color:var(--navy-950);}
  .service-row .meta{font-size:.78rem;color:var(--ink-soft);margin-top:1px;}
  .outstanding-row{border-left:4px solid var(--amber);}

  /* ---- Client credentials (admin/reviewer only) ---- */
  .cred-row{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--mist);}
  .cred-row .cred-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .cred-row .cred-label{font-weight:700;font-size:.9rem;color:var(--navy-950);}
  .cred-row .cred-field{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);margin-top:3px;}
  .cred-row .cred-field code{font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--border);border-radius:5px;padding:1px 7px;color:var(--navy-900);}
  .cred-row .cred-notes{font-size:.8rem;color:var(--ink-soft);margin-top:6px;}

  /* ---- Personal to-do list (private per user) ---- */
  .todo-del{margin-left:auto;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1.15rem;line-height:1;padding:2px 8px;flex:0 0 auto;}
  .todo-del:hover{color:var(--red);}

  #toast{position:fixed;bottom:24px;right:24px;max-width:360px;background:var(--navy-950);color:#fff;padding:16px 20px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:50;font-size:.9rem;}
  #toast.error{background:var(--red);}

  /* ---- Modal (used for new task/client/engagement forms) ---- */
  #modalOverlay{position:fixed;inset:0;background:rgba(10,31,58,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;}
  #modalCard{background:#fff;border-radius:14px;padding:28px;max-width:520px;width:100%;box-shadow:0 24px 48px rgba(0,0,0,.3);}
  #modalCard .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  #modalCard .modal-actions{display:flex;gap:10px;margin-top:20px;}


  /* ---- 2026 workspace IA / staff profile / attendance ---- */
  #sidebar .sidebar-group{padding-top:18px;color:#708095;}
  #sidebar .sidebar-group:first-child{padding-top:6px;}
  .workspace-intro{font-size:.88rem;color:var(--ink-soft);margin:-10px 0 20px;max-width:760px;}
  .page-head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .my-tasks-filter{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:14px 16px;flex-wrap:wrap;}
  .scope-tabs-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--ink-soft);}
  .scope-tabs{display:inline-flex;gap:4px;padding:4px;background:var(--mist);border:1px solid var(--border);border-radius:10px;}
  .my-tasks-completed-toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-soft);cursor:pointer;}
  .scope-tab{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-size:.82rem;font-weight:700;padding:8px 12px;border-radius:7px;cursor:pointer;}
  .scope-tab:hover{color:var(--navy-900);background:#fff;}
  .scope-tab.is-active{background:#fff;color:var(--navy-950);box-shadow:0 1px 3px rgba(10,31,58,.12);}
  .scope-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:18px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--border);}
  .scope-section-head h2{font-size:1rem;margin:0;color:var(--navy-950);}
  .scope-section-head p{font-size:.75rem;color:var(--ink-soft);margin:0;text-align:right;}
  .scope-section-head--firm{margin-top:28px;}
  .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px;}
  .metric-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:17px 18px;}
  .metric-card .metric-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--ink-soft);}
  .metric-card .metric-value{display:block;margin-top:5px;font-size:1.35rem;font-weight:750;color:var(--navy-950);}
  .attendance-punch-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;background:linear-gradient(135deg,var(--navy-950),var(--navy-800));color:#fff;border:none;}
  .attendance-punch-card h2{color:#fff;}
  .attendance-punch-card p.desc{color:rgba(255,255,255,.72);margin-bottom:0;}
  /* Task 30: current Nepal time, stated as an actual value right next to
     today's punch status (priority position 2), not just a "(UTC+05:45)"
     aside easy to skim past. */
  .nepal-now-line{font-size:.82rem;color:var(--gold-500);font-weight:700;margin-top:4px;}
  .attendance-punch-card .punch-state{font-size:.82rem;color:rgba(255,255,255,.76);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;}
  .attendance-punch-card .btn{min-width:142px;}
  .attendance-controls{display:grid;grid-template-columns:minmax(160px,220px) minmax(210px,1fr) auto;gap:12px;align-items:end;}
  .attendance-controls .f{margin-bottom:0;}
  .attendance-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px;}
  .cal-head{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding:4px;}
  .cal-day{min-height:78px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:8px;}
  .cal-day.is-empty{background:transparent;border-color:transparent;}
  .cal-day .day-num{font-size:.75rem;font-weight:700;color:var(--navy-900);}
  .cal-day .day-status{font-size:.68rem;margin-top:10px;color:var(--ink-soft);line-height:1.25;}
  .cal-day.has-record{border-color:#C8D6E6;background:#FBFCFE;}
  .cal-day.is-complete .day-status{color:var(--green);font-weight:700;}
  .cal-day.is-open .day-status{color:var(--amber);font-weight:700;}
  .directory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
  .directory-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;gap:14px;align-items:flex-start;}
  .profile-photo{width:54px;height:54px;border-radius:14px;object-fit:cover;background:var(--gold-100);border:1px solid var(--border);flex:0 0 auto;}
  .profile-photo-lg{width:78px;height:78px;border-radius:18px;}
  .profile-photo-fallback{display:flex;align-items:center;justify-content:center;color:var(--gold-700);font-weight:800;font-size:1.05rem;}
  .profile-photo-lg.profile-photo-fallback{font-size:1.45rem;}
  .directory-card h3{font-size:1rem;margin:1px 0 2px;}
  .directory-card .dir-role{font-size:.78rem;color:var(--gold-700);font-weight:700;margin-bottom:8px;}
  .directory-card .dir-line{font-size:.78rem;color:var(--ink-soft);margin-top:3px;overflow-wrap:anywhere;}
  .profile-hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#fff,var(--gold-100));}
  .profile-hero h1{font-size:1.5rem;}
  .profile-hero .profile-meta{font-size:.86rem;color:var(--ink-soft);margin-top:5px;}
  .profile-hero-photo-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;}
  .profile-hero-edit-btn{background:none;border:none;padding:0;font-size:.72rem;font-weight:700;color:var(--gold-700);cursor:pointer;text-decoration:underline;}
  .profile-hero-edit-btn:hover{color:var(--gold-600);}
  .profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .attendance-status-pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:.72rem;font-weight:700;background:var(--mist-dark);color:var(--navy-800);}
  .attendance-status-pill.complete{background:var(--green-soft);color:var(--green);}
  .attendance-status-pill.open{background:var(--amber-soft);color:var(--amber);}
  .admin-link-btn{display:flex!important;align-items:center;gap:11px;width:100%;padding:10px 12px!important;border-radius:8px;color:var(--ink-soft)!important;font-size:.9rem!important;font-weight:600!important;text-decoration:none!important;}
  .admin-link-btn:hover{background:#fff;color:var(--navy-900)!important;}
  @media(max-width:1050px){.directory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:720px){.my-tasks-filter{align-items:flex-start;flex-direction:column}.scope-tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.scope-tab{padding:9px 6px}.scope-section-head{align-items:flex-start;flex-direction:column;gap:3px}.scope-section-head p{text-align:left}.attendance-punch-card{grid-template-columns:1fr}.attendance-controls{grid-template-columns:1fr}.directory-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:1fr}.attendance-calendar{gap:4px}.cal-day{min-height:62px;padding:6px}.cal-day .day-status{font-size:.62rem;margin-top:6px}}

  /* Task 35: Work Desk's own hover transitions are already minimal/
     functional (120ms color/border/shadow, one 1px hover "lift" on
     clickable rows) -- never marketing-style scroll reveal, which this
     app has none of. This still respects prefers-reduced-motion for the
     transform specifically, the one property here that's actual motion
     rather than a colour/shadow fade. */
  @media (prefers-reduced-motion: reduce) {
    #sidebar button, .task-row, .hub-stat { transition: none; }
    .task-row:hover { transform: none; }
  }

</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div id="loginScreen">
  <div class="login-card">
    <div class="brand"><img src="/images/logo-icon.png" alt=""><span>Maven Consultancy</span></div>
    <h1>Work Desk</h1>
    <p class="sub">Sign in with the email and password you were given.</p>
    <div id="loginMsg" role="alert"></div>
    <div class="f">
      <label for="in-email">Email</label>
      <input id="in-email" type="email" autocomplete="username">
    </div>
    <div class="f">
      <label for="in-password">Password</label>
      <input id="in-password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-block" id="loginBtn" type="button">Sign In</button>
    <p class="f-hint" style="margin-top:14px;text-align:center">Don't have an account? Ask your admin to invite you.</p>
    <p class="f-hint" style="text-align:center"><a href="#" id="forgotPasswordLink">Forgot password?</a></p>
  </div>
</div>

<div id="app" class="hidden">
  <header id="topbar">
    <button class="btn btn-outline btn-sm drawer-toggle" id="navToggleBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <span id="menuIconSlot"></span>
    </button>
    <button class="brand" id="brandHomeBtn" type="button"><img src="/images/logo-icon.png" alt=""><span>Maven Work Desk</span></button>
    <div class="spacer"></div>
    <button class="btn btn-outline btn-sm" id="globalSearchBtn" type="button" title="Global Search" aria-label="Global Search">
      <span id="searchIconSlot"></span>
    </button>
    <button class="btn btn-outline btn-sm" id="notifBellBtn" type="button" title="Notifications (Client Work only)" aria-label="Notifications (Client Work only)">
      <span id="notifBellIconSlot"></span>
      <span id="notifBadge" class="notif-badge hidden">0</span>
    </button>
    <div class="who"><strong id="whoName">—</strong><span id="whoRole">—</span></div>
    <button class="btn btn-outline btn-sm" id="logoutBtn" type="button">Sign Out</button>
  </header>
  <button class="drawer-close" id="navCloseBtn" type="button" aria-label="Close menu">
    <span id="closeIconSlot"></span>
  </button>
  <div id="layout">
    <nav id="sidebar" aria-label="Primary"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="notifPanel" class="notif-panel hidden"></div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="modalOverlay" class="hidden"><div id="modalCard" role="dialog" aria-modal="true" tabindex="-1"></div></div>

<script src="supabase.js"></script>
<script src="staff.js"></script>
</body>
</html>
