aboutText: >-
  Maven Consultancy Services Pvt. Ltd. is a Nepal-based consultancy company providing business
  setup, accounting, tax, compliance, financial reporting support, payroll, project report, and
  advisory services. We support entrepreneurs and business owners with straightforward guidance,
  organized records, timely compliance reminders, and clear communication.
aboutFacts:
  - Based in New Baneshwor, Kathmandu
  - Established in 2022 — 100+ clients served to date
  - Service coverage across Nepal, plus remote outsourced support for international clients
  - Focus on startups, small businesses, and growing companies
aboutClosing: >-
  We are a focused, growing consultancy — not a large firm, and we don't try to be. We keep things
  grounded, organized, and easy to understand for business owners who need dependable support
  without unnecessary complexity.
values:
