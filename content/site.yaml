    text: We support submission to the relevant office or deliver your report.
  - step: 9
    title: Final payment and file closing
    text: Once work is complete, final payment is collected and the file is closed.
faqs:
  - q: Does Maven provide statutory audit services?
    a: >-
      No. Maven does not present itself as a statutory audit firm. We provide accounting, tax,
      compliance, financial reporting support, and document coordination. Where licensed audit or
      certification is required, clients must work with an independent licensed professional.
  - q: Can Maven handle monthly accounting for my business?
    a: >-
      Yes. Maven provides outsourced bookkeeping, accounting, VAT/TDS support, payroll support, and
      monthly compliance tracking based on your business size and transaction volume.
  - q: Do you serve clients outside Kathmandu?
    a: >-
      Yes. Maven is based in Kathmandu and provides services to clients across Nepal, depending on
      the service type and document availability.
  - q: Can you register my company and PAN/VAT?
    a: >-
      Maven provides registration guidance, document preparation, and submission support. Exact
      requirements depend on the business type and government office process.
  - q: Do you publish fixed prices?
    a: >-
      Some services may have starting fees, but final pricing depends on workload, urgency, document
      condition, and scope. Government fees and third-party charges are separate.
  - q: Is my business data safe?
    a: >-
      Maven follows confidentiality, organized document handling, and controlled access practices
      for client records.
footerDisclaimer: >-
  Maven Consultancy Services Pvt. Ltd. is a business consultancy and outsourced
  accounting/compliance service provider. Maven is not a licensed audit firm and does not provide
  statutory audit, legal, or certification services. Where such services are required, Maven helps
  clients coordinate with independent licensed professionals.
