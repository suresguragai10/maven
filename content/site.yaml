privacyIntro: >-
  This Privacy Policy explains how Maven Consultancy Services Pvt. Ltd. ("Maven", "we", "us")
  collects, uses, and protects the information you share with us through this website. By using this
  website or submitting the contact form, you agree to the practices described below.
privacySections:
  - title: Information we collect
    text: >-
      When you submit the inquiry form, we collect the details you provide — such as your name,
      business name, phone number, email address, the service you are interested in, your business
      type, and your message. We do not collect sensitive financial records through this website.
  - title: How we use your information
    text: >-
      We use your information only to respond to your inquiry, understand your requirement, prepare
      a quotation, and provide the services you ask for. We do not sell or rent your information to
      anyone.
  - title: How your information is shared
    text: >-
      Contact form submissions are delivered to us through Formspree, a third-party form service. We
      share your details only with our own team members who need them to respond to you. We do not
      share your information with unrelated third parties for marketing.
  - title: Data retention
    text: >-
      We keep inquiry details only as long as needed to respond to you and, where you become a
      client, to provide our services and meet record-keeping obligations. You can ask us to delete
      your inquiry information at any time.
  - title: Confidentiality
    text: >-
      Client financial and business information is handled with confidentiality, organized document
      handling, and controlled access, consistent with our professional practice.
  - title: Your choices
    text: >-
      You can contact us by phone, WhatsApp, or email instead of using the form. You may request
      access to, correction of, or deletion of the information you have shared with us.
  - title: Contact about privacy
    text: >-
      For any questions about this policy or your information, contact us using the details on our
      Contact page. We will respond as promptly as we can.
calculators:
  vatRate: 13
  vatNote: >-
    Nepal's standard VAT rate is 13%. Whether VAT applies depends on registration status and the
    nature of goods/services.
  tdsTypes:
    - label: Rent — paid to company/entity (10%)
      rate: 10
      note: Rent — land/building paid to a company/entity
    - label: Service/contract — VAT-registered (1.5%)
      rate: 1.5
      note: Service/contract — VAT-registered supplier
    - label: Service fee — PAN-only supplier (15%)
      rate: 15
      note: Service fee — PAN-only supplier (not VAT-registered)
    - label: Consultancy fee (15%)
      rate: 15
      note: Consultancy fee
    - label: Commission (15%)
      rate: 15
      note: Commission
    - label: Royalty (15%)
      rate: 15
      note: Royalty
    - label: Dividend — final (5%)
      rate: 5
      note: Dividend (final withholding)
    - label: Bank interest — individual, final (5%)
      rate: 5
      note: Bank interest to resident individual (final)
    - label: Interest — entities/others (15%)
      rate: 15
      note: Interest — entities/others
    - label: Windfall gain / lottery (25%)
      rate: 25
      note: Windfall gain / lottery (final)
  tdsNote: >-
    Common rates under the Income Tax Act 2058 / Finance Act 2082. Notes: rent paid to an individual
    landlord is generally not subject to income-tax TDS (local rent tax may apply); contract TDS
    applies once cumulative payments to one supplier exceed NPR 50,000 in a year; rates change with
    each Finance Act. Confirm the right treatment with Maven before deducting.
