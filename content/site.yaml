documentsTopNote: >-
  Document requirements may vary depending on business type, ownership structure, location,
  government office requirements, and service scope. Please contact Maven before submitting
  documents so we can confirm the exact checklist for your case.
documentGroups:
  - title: For Company Registration Support
    items:
      - Proposed company name options
      - Business objective/activity details
      - Founder/shareholder citizenship copies or passport copies
      - Shareholder/director details
      - Proposed capital and shareholding structure
      - Contact number, email, and address details
      - Any special approval/license if the business activity requires it
  - title: For PAN/VAT Registration Support
    items:
      - Company/firm registration certificate, if already registered
      - Memorandum and Articles of Association, if company
      - Citizenship/passport copies of owner/directors
      - Office address details
      - Rent agreement or ownership document, if applicable
      - Business contact details
      - Business nature and estimated turnover/activity details
  - title: For Monthly Accounting Support
    items:
      - Sales invoices
      - Purchase bills
      - Expense bills
      - Bank statements
      - Cash book or cash transaction details
      - Salary/payroll details
      - Rent and TDS details
      - VAT/TDS records, if applicable
      - Loan statements, if applicable
      - Receivable/payable details
      - Stock details, if applicable
  - title: For Tax Clearance / Return Support
    items:
      - PAN/VAT details
      - Previous tax returns, if available
      - Financial statements or accounting records
      - VAT/TDS filing details
      - Bank statements
      - Sales and purchase records
      - Payment vouchers and expense bills
      - Any notices or correspondence from tax office
  - title: For Project Report / Loan Report
    items:
      - Business registration documents
      - PAN/VAT certificate
      - Business profile
      - Investment details
      - Revenue and expense assumptions
      - Loan requirement details
      - Owner/promoter details
      - Existing financial statements, if any
      - Bank-specific requirements, if available
documentsBottomNote: >-
